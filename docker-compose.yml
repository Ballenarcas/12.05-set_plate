name: set-and-plate

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    # Built and pushed by CI on every green push to master. There is
    # deliberately no `build:` section: Portainer only rebuilds when a service
    # sets `pull_policy: build`, so a plain `build:` section leaves the stack
    # running whatever image happened to be on the host (portainer#6288).
    image: ghcr.io/ballenarcas/set-plate-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    networks:
      - edge
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_KEY: ${SUPABASE_KEY:?SUPABASE_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-12}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    expose:
      - "8000"
    logging: *default-logging

  frontend:
    # Same-origin requests: the SPA talks to nginx, nginx talks to the API, so
    # VITE_API_URL is baked in empty by the CI build.
    image: ghcr.io/ballenarcas/set-plate-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,nosuid
      - /var/cache/nginx:size=32m,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    networks:
      - edge
    # Loopback only: reachable by cloudflared or `tailscale serve` running on
    # the host, invisible from the LAN and from the internet.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    logging: *default-logging

networks:
  edge:
    driver: bridge
    # Deliberately NOT `internal: true`. Docker does not allocate published
    # ports for a container whose networks are internal, so the frontend came
    # up healthy with no host port at all and the tunnel answered 502
    # (`NetworkSettings.Ports` was `{}`). Isolation comes from elsewhere:
    # only the frontend publishes anything, and only on 127.0.0.1, while the
    # backend has no published port.
    ipam:
      config:
        - subnet: 172.28.0.0/24
