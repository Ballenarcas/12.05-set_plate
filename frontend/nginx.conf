# Client IP as seen by the tunnel. Only the hop that actually reaches this
# container is trusted, so a published port cannot be used to spoof it.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.28.0.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# The edge terminates TLS; keep the original scheme when it is forwarded.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

log_format no_query_args '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    access_log /var/log/nginx/access.log no_query_args;
    limit_conn conn_per_ip 20;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Resolve the backend through Docker's DNS so a container restart does not
    # leave nginx pointing at a stale IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Exact match wins over ^~ /api/, so only the login endpoint gets the slow
    # bucket. Five attempts per minute per IP; burst absorbs a mistyped retry.
    location = /api/v1/users/login {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location ^~ /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
