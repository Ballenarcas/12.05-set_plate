name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22 matches the image the container build uses, and the test runner
          # needs --experimental-strip-types, which does not exist on 20.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Non-blocking on purpose: the codebase still carries 7 findings
      # (react-hooks/set-state-in-effect, two explicit `any`, one unused
      # parameter). They are pre-existing and fixing them means reshaping
      # effects in screens nobody asked to touch. Drop continue-on-error once
      # the backlog is empty so regressions fail the build.
      - name: Lint (non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      GROQ_API_KEY: ""
      AUTH_SECRET_KEY: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Run Pytest
        working-directory: backend
        run: pytest -q

  containers:
    name: Containers (compose, images, nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dummy values: `docker compose config` runs the same interpolation as a
    # deploy, including the `:?` guards, without ever talking to Supabase.
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: ci-dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      AUTH_SECRET_KEY: ci-dummy-auth-secret
      ALLOWED_HOSTS: example.com
      CORS_ORIGINS: https://example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose config -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: set-and-plate-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: set-and-plate-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # The nginx config is the piece that broke the last deployment: catch a
      # bad directive or a wrong `listen` port here instead of on the NAS.
      - name: Validate the nginx config
        run: docker run --rm set-and-plate-frontend:ci nginx -t

      - name: Serve the SPA and check the health endpoint
        run: |
          set -euo pipefail
          docker run -d --name ci-frontend -p 127.0.0.1:18080:8080 set-and-plate-frontend:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q ok
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:18080/ | grep -q 200
          docker rm -f ci-frontend

  images:
    name: Publish images (GHCR)
    # Only on a real push: a pull request must never overwrite `latest`, and
    # its token cannot push packages for a fork anyway.
    if: github.event_name == 'push'
    needs: [frontend-check, backend-check, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the owner: GHCR rejects `Ballenarcas/...`,
      # and the compose file references the lowercased path.
      - name: Backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/set-plate-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          # Single-arch and no provenance attestation: Portainer runs plain
          # `docker pull`, and an attestation manifest confuses older engines.
          provenance: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/set-plate-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  ci-gate:
    name: CI Status Gate
    needs: [frontend-check, backend-check, containers, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          for result in "${{ needs.frontend-check.result }}" \
                        "${{ needs.backend-check.result }}" \
                        "${{ needs.containers.result }}"; do
            if [ "$result" != "success" ]; then
              echo "CI pipeline failed. Fix errors before merging."
              exit 1
            fi
          done
          # `images` is skipped on pull requests by design.
          case "${{ needs.images.result }}" in
            success|skipped) ;;
            *)
              echo "::error::The image publish job failed."
              exit 1
              ;;
          esac
          echo "All checks passed successfully."
