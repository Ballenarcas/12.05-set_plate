name: Deploy

# Runs only after CI is green on master, so a red build never reaches the NAS.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Portainer redeploy (via Tailscale)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # master without the compose file is a branch that was never meant to be
      # deployed; failing here beats letting Portainer pull it and take the
      # stack down.
      - name: Verify the commit is deployable
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "::error::docker-compose.yml is missing on this commit; refusing to redeploy"
            exit 1
          fi
          if ! grep -q 'ghcr\.io/' docker-compose.yml; then
            echo "::error::docker-compose.yml does not reference a registry image."
            echo "::error::Without one, the stack only rebuilds if it sets pull_policy: build, so it would keep the old image."
            exit 1
          fi

      # Portainer is not published to the internet, so the runner joins the
      # tailnet for the duration of the job instead of opening any port.
      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          ping: ${{ vars.PORTAINER_HOST }}

      # Recorded so the post-deploy check can tell whether the bundle was
      # actually replaced or Portainer kept the previous image.
      - name: Record the current bundle
        id: before
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          bundle=$(curl -fsS --max-time 10 "${PUBLIC_URL:-http://127.0.0.1:1}/" 2>/dev/null \
            | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
          echo "bundle=${bundle:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Serving: ${bundle:-unknown}"

      # A private GHCR package cannot be pulled by the NAS, and the stack goes
      # down while it retries. Checking anonymously is exactly what the host
      # does, so it fails here instead of in production.
      - name: Verify the images are pullable without credentials
        run: |
          set -uo pipefail
          mapfile -t images < <(grep -oE 'ghcr\.io/[A-Za-z0-9._/-]+' docker-compose.yml | sort -u)
          if [ ${#images[@]} -eq 0 ]; then
            echo "::error::No ghcr.io image found in docker-compose.yml"
            exit 1
          fi
          for image in "${images[@]}"; do
            ref="${image}:latest"
            if error=$(docker manifest inspect "$ref" 2>&1 >/dev/null); then
              echo "ok: ${ref} is public"
            else
              echo "::error::${ref} cannot be pulled anonymously: ${error%%$'\n'*}"
              echo "::error::Open Packages -> ${image##*/} -> Package settings -> Change visibility -> Public."
              exit 1
            fi
          done

      # Stack webhooks are a Business Edition feature, so the Community
      # Edition instance on the NAS is driven through the API instead. This
      # endpoint also forces a re-pull of the image, which is what makes the
      # new `latest` from GHCR land on the host.
      - name: Redeploy the stack through the Portainer API
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
        run: |
          set -euo pipefail

          for name in PORTAINER_URL PORTAINER_STACK_ID PORTAINER_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done

          stack_url="${PORTAINER_URL%/}/api/stacks/${PORTAINER_STACK_ID}"
          query=""
          if [ -n "${PORTAINER_ENDPOINT_ID:-}" ]; then
            query="?endpointId=${PORTAINER_ENDPOINT_ID}"
          fi

          # Portainer serves a self-signed certificate unless you configured
          # a real one. Over the tailnet that is acceptable; it would not be
          # over the public internet.
          opts=(-sS --max-time 120)
          case "$PORTAINER_URL" in
            https://*) opts+=(-k) ;;
          esac
          auth=(-H "X-API-Key: ${PORTAINER_API_TOKEN}")

          # Never echo a response body blindly. Portainer answers a successful
          # redeploy with the whole stack object, environment variables and
          # their values included, and those are not GitHub secrets, so the
          # runner would not mask them. Only the two error fields are printed,
          # and never the raw bytes: a body that is not JSON is not shown.
          show_error() {
            local file="$1"
            [ -s "$file" ] || return 0
            jq -e -r '(.message // empty), (.details // empty)' "$file" 2>/dev/null || true
            echo
          }

          # Why read the stack first: Portainer CE 2.19-2.21 (and several
          # later releases) do `stack.Env = payload.Env` unconditionally in
          # stack_update_git_redeploy.go. A body without `Env` therefore
          # deploys with no variables at all, and every `${VAR:?}` in the
          # compose file fails with "required variable ... is missing a
          # value", picked at random because Compose walks a Go map.
          # Echo the stored values back so the redeploy keeps them.
          code=$(curl "${opts[@]}" "${auth[@]}" -o /tmp/stack.json -w '%{http_code}' \
            "${stack_url}${query}") || code=000
          case "$code" in
            200) ;;
            000)
              echo "::error::Could not reach ${PORTAINER_URL} over the tailnet."
              echo "::error::Check the OAuth client, the ACL grant to tcp:9443, and that Portainer is running."
              exit 1
              ;;
            401|403)
              echo "::error::Portainer rejected the API token. Check PORTAINER_API_TOKEN."
              exit 1
              ;;
            404)
              echo "::error::Stack ${PORTAINER_STACK_ID} not found. Check PORTAINER_STACK_ID and PORTAINER_ENDPOINT_ID."
              exit 1
              ;;
            *)
              echo "::error::Could not read stack ${PORTAINER_STACK_ID} (HTTP ${code})"
              show_error /tmp/stack.json
              exit 1
              ;;
          esac

          chmod 600 /tmp/stack.json
          env_json=$(jq -c '.Env // []' /tmp/stack.json)
          reference=$(jq -r '.GitConfig.ReferenceName // ""' /tmp/stack.json)
          echo "Stack ${PORTAINER_STACK_ID} defines $(jq 'length' <<<"$env_json") environment variable(s)"

          # Belt and braces: register every stored value with the runner so it
          # is redacted anywhere it could appear (an accidental `curl -v`,
          # `set -x`, or an error thrown by a library). Nothing prints these
          # values on purpose; this is only a safety net, and it is why the
          # log may show `***` for a URL in the later steps.
          while IFS= read -r value; do
            [ ${#value} -ge 8 ] || continue
            case "$value" in *$'\n'*) continue ;; esac
            echo "::add-mask::${value}"
          done < <(jq -r '.[] | .value // empty' <<<"$env_json")

          # Fail before touching the stack when a `${VAR:?}` has no value.
          # Portainer only reports one of them, chosen at random, per attempt.
          missing=""
          while read -r required; do
            [ -n "$required" ] || continue
            if [ "$(jq --arg n "$required" \
              '[.[] | select((.name | ascii_downcase) == ($n | ascii_downcase) and ((.value // "") | length) > 0)] | length' \
              <<<"$env_json")" = "0" ]; then
              missing="${missing} ${required}"
            fi
          done < <(grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*:\?' docker-compose.yml \
            | sed -E 's/^\$\{//; s/:\?$//' | sort -u)

          if [ -n "$missing" ]; then
            echo "::error::The stack is missing a value for:${missing}"
            echo "::error::Add them under Stacks -> set_plate -> Environment variables, click Update the stack, then retry."
            exit 1
          fi

          # `PullImage` is the old name of `RepullImageAndRedeploy`; unknown
          # fields are ignored, so sending both keeps every CE release happy.
          jq -n --argjson env "$env_json" --arg ref "$reference" \
            '{"RepullImageAndRedeploy": true, "PullImage": true, "Prune": false, "Env": $env}
             + (if $ref == "" then {} else {"RepositoryReferenceName": $ref} end)' \
            > /tmp/body.json
          chmod 600 /tmp/body.json

          url="${stack_url}/git/redeploy${query}"
          for attempt in 1 2 3; do
            code=$(curl "${opts[@]}" -o /tmp/redeploy.out -w '%{http_code}' -X PUT \
              "${auth[@]}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/body.json "$url") || code=000
            echo "attempt ${attempt}: Portainer answered HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Stack ${PORTAINER_STACK_ID} accepted the redeploy"
              exit 0
            fi
            show_error /tmp/redeploy.out
            case "$code" in
              000)
                echo "::error::Could not reach ${PORTAINER_URL} over the tailnet."
                echo "::error::Check the OAuth client, the ACL grant to tcp:9443, and that Portainer is running."
                exit 1
                ;;
              409)
                # Another deployment of the same stack is still running.
                echo "Stack is busy; retrying in 20s"
                sleep 20
                ;;
              400)
                echo "::error::Portainer refused the redeploy (400)."
                echo "::error::The stack is not Git-based. Recreate it from the repository, then retry."
                exit 1
                ;;
              401|403)
                echo "::error::Portainer rejected the API token. Check PORTAINER_API_TOKEN."
                exit 1
                ;;
              404)
                echo "::error::Stack ${PORTAINER_STACK_ID} not found. Check PORTAINER_STACK_ID and PORTAINER_ENDPOINT_ID."
                exit 1
                ;;
              *)
                if grep -q 'required variable' /tmp/redeploy.out 2>/dev/null; then
                  echo "::error::Compose still sees a missing variable. Check the stack's Environment variables."
                fi
                echo "::error::Unexpected HTTP ${code} from the Portainer API"
                exit 1
                ;;
            esac
          done
          echo "::error::The stack stayed busy; a previous deployment never finished"
          exit 1

      # A 200 only proves the deployment started. Pulling images and
      # recreating the containers takes minutes, so poll the public entry
      # point until it answers again; a 502 in the meantime is expected.
      - name: Wait until the app is serving
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_URL:-}" ]; then
            echo "::warning::PUBLIC_URL is not set; skipping the health check"
            exit 0
          fi
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 "$PUBLIC_URL/healthz" | grep -q 'ok'; then
              echo "App healthy after ~$((attempt * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PUBLIC_URL/healthz did not answer ok within 10 minutes"
          echo "Check that the stack tracks master, that the GHCR pull succeeded, and the backend logs."
          exit 1

      - name: Verify the API and the security headers
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          BEFORE: ${{ steps.before.outputs.bundle }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_URL:-}" ]; then
            echo "::warning::PUBLIC_URL is not set; skipping the post-deploy checks"
            exit 0
          fi

          api=$(curl -fsS --max-time 10 "$PUBLIC_URL/api/v1/health")
          echo "API: $api"
          echo "$api" | grep -q '"status"' || { echo "::error::/api/v1/health did not return a status"; exit 1; }

          headers=$(curl -fsSI --max-time 10 "$PUBLIC_URL/")
          echo "$headers" | grep -qi '^content-security-policy:' \
            || { echo "::error::Missing Content-Security-Policy: nginx.conf was not applied"; exit 1; }
          echo "$headers" | grep -qi '^x-frame-options: DENY' \
            || { echo "::error::Missing X-Frame-Options: DENY"; exit 1; }

          after=$(curl -fsS --max-time 10 "$PUBLIC_URL/" \
            | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
          echo "Bundle before: $BEFORE"
          echo "Bundle after:  ${after:-unknown}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" = "$after" ]; then
            echo "::warning::The bundle hash did not change. If this commit touched the frontend, the NAS is still running the previous image: confirm the GHCR package is public, or add registry credentials in Portainer."
          fi
