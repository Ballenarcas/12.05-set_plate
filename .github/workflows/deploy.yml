name: Deploy

# Runs only after CI is green on master, so a red build never reaches the NAS.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Portainer redeploy (via Tailscale)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # master without the compose file is a branch that was never meant to be
      # deployed; failing here beats letting Portainer pull it and take the
      # stack down.
      - name: Verify the commit is deployable
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "::error::docker-compose.yml is missing on this commit; refusing to redeploy"
            exit 1
          fi

      # Portainer is not published to the internet, so the runner joins the
      # tailnet for the duration of the job instead of opening any port.
      - name: Connect to the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          ping: ${{ vars.PORTAINER_HOST }}

      # Recorded so the post-deploy check can tell whether the bundle was
      # actually rebuilt or Portainer reused the previous image.
      - name: Record the current bundle
        id: before
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          bundle=$(curl -fsS --max-time 10 "$PUBLIC_URL/" 2>/dev/null \
            | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
          echo "bundle=${bundle:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Serving: ${bundle:-unknown}"

      - name: Trigger the stack webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::error::PORTAINER_WEBHOOK_URL is not set"
            exit 1
          fi
          code=$(curl -sS --max-time 30 -o /tmp/webhook.out -w '%{http_code}' -X POST "$WEBHOOK_URL")
          echo "Portainer answered HTTP $code"
          [ -s /tmp/webhook.out ] && cat /tmp/webhook.out
          # Portainer replies 204 (or 200 on older versions) and deploys in the
          # background; anything else means the request never reached the stack.
          case "$code" in
            200|204) ;;
            *) echo "::error::Unexpected HTTP $code from the Portainer webhook"; exit 1 ;;
          esac

      # A webhook returning 204 only proves the request was accepted. Recreating
      # the images takes a few minutes, so poll the public entry point until it
      # answers again; a 502 while the frontend restarts is expected.
      - name: Wait until the app is serving
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_URL:-}" ]; then
            echo "::warning::PUBLIC_URL is not set; skipping the health check"
            exit 0
          fi
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 "$PUBLIC_URL/healthz" | grep -q 'ok'; then
              echo "App healthy after ~$((attempt * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PUBLIC_URL/healthz did not answer ok within 10 minutes"
          echo "Check the stack branch is master, that Portainer rebuilt the images, and the backend logs."
          exit 1

      - name: Verify the API and the security headers
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          BEFORE: ${{ steps.before.outputs.bundle }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_URL:-}" ]; then
            echo "::warning::PUBLIC_URL is not set; skipping the post-deploy checks"
            exit 0
          fi

          api=$(curl -fsS --max-time 10 "$PUBLIC_URL/api/v1/health")
          echo "API: $api"
          echo "$api" | grep -q '"status"' || { echo "::error::/api/v1/health did not return a status"; exit 1; }

          headers=$(curl -fsSI --max-time 10 "$PUBLIC_URL/")
          echo "$headers" | grep -qi '^content-security-policy:' \
            || { echo "::error::Missing Content-Security-Policy: nginx.conf was not applied"; exit 1; }
          echo "$headers" | grep -qi '^x-frame-options: DENY' \
            || { echo "::error::Missing X-Frame-Options: DENY"; exit 1; }

          after=$(curl -fsS --max-time 10 "$PUBLIC_URL/" \
            | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
          echo "Bundle before: $BEFORE"
          echo "Bundle after:  ${after:-unknown}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" = "$after" ]; then
            echo "::warning::The bundle hash did not change. If this commit touched the frontend, Portainer served the cached image; see the rebuild note in deploy/HOMELAB.md."
          fi
